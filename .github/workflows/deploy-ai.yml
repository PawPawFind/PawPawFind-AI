name: Deploy AI

on:
  push:
    branches: [develop, main]
    paths:
      - "app/**"
      - "scripts/**"
      - "pyproject.toml"
      - "uv.lock"
      - "deploy/pawpawfind-ai.service"
      - ".github/workflows/deploy-ai.yml"
  workflow_dispatch:

concurrency:
  group: deploy-ai
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pack source (exclude venv/cache)
        run: |
          tar czf ai-deploy.tgz \
            --exclude=.venv \
            --exclude=cache \
            --exclude=__pycache__ \
            --exclude=.pytest_cache \
            --exclude=.git \
            .

      - name: Upload bundle to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          source: ai-deploy.tgz
          target: /home/ec2-user/

      - name: Install deps and restart AI service
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          command_timeout: 30m
          script: |
            set -e
            mkdir -p ~/logs ~/PawPawFind-AI
            tar xzf ~/ai-deploy.tgz -C ~/PawPawFind-AI
            rm -f ~/ai-deploy.tgz
            export PATH="$HOME/.local/bin:$PATH"
            cd ~/PawPawFind-AI
            uv sync --group ml --frozen
            sudo cp deploy/pawpawfind-ai.service /etc/systemd/system/ 2>/dev/null || true
            sudo systemctl daemon-reload
            sudo systemctl restart pawpawfind-ai
            sleep 3
            sudo systemctl is-active pawpawfind-ai
